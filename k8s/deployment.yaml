
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cca2-app
  namespace: cca2
  labels:
    app: cca2-app

spec:
  replicas: 2
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: cca2-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: cca2-app

    spec:
      containers:
        - name: cca2-app
          image: vaibhaviz/cca2-app:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
