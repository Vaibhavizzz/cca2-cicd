# ============================================================================
# Service (NodePort)
#
# EDIT ONE THING: targetPort must equal the containerPort in deployment.yaml.
#
# port       80    -> the port other things inside the cluster use
# targetPort 8080  -> the port the container actually listens on
# nodePort   30080 -> the port exposed on the Minikube node itself
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: cca2-app
  namespace: cca2
  labels:
    app: cca2-app
spec:
  type: NodePort
  selector:
    app: cca2-app        # this label is how the Service finds the Pods
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080   # EDIT ME to match containerPort
      nodePort: 30080
